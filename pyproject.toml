[project]
name = "clair-ai"
version = "0.1.0"
description = "AI pipeline for Clair contract analyzer"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
  "paddleocr>=2.9.0",
  "ultralytics>=8.3.0",
  "torch>=2.6.0",
  "lightning>=2.5.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pypdfium2>=4.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
